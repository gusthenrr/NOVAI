<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAI — Minha conta</title>
<style nonce="{{ nonce }}">*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:16px Arial}main{width:min(440px,94vw);padding:30px;border:1px solid #333;border-radius:24px;background:#202020}h1{color:#ffed00;margin-top:0}label{display:block;margin:18px 0 8px}input:not([type=checkbox]),button{width:100%;padding:14px;border-radius:12px;border:1px solid #555;font:inherit}input{background:#111;color:#fff}button{margin-top:16px;background:#ffed00;color:#111;cursor:pointer;font-weight:bold}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:#eee}a{color:#ffed00}p{line-height:1.5}#status{min-height:24px} [hidden]{display:none!important}</style></head><body><main>
<h1>NOVAI</h1><h2 id="title">Entrar</h2><p id="status" role="status" aria-live="polite"></p>
<form id="form"><div id="name-row" hidden><label for="name">Nome</label><input id="name" maxlength="100" autocomplete="name"></div>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required maxlength="254">
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required maxlength="72">
<div id="new-password-row" hidden><label for="new-password">Nova senha (mínimo de 8 caracteres)</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72"></div>
<label id="terms-row" hidden><input id="terms" type="checkbox"> Li e aceito o <a href="/api/precify/terms" target="_blank" rel="noopener">acordo NOVAI e Precify</a>.</label>
<button id="submit" type="submit">Entrar</button><button id="toggle" type="button" class="secondary">Criar conta</button></form>
<section id="connected" hidden><p>Sua sessão NOVAI está conectada. Você pode voltar à aba do Mercado Livre.</p><p id="link-status"></p><button id="connect">Conectar Mercado Livre</button><button id="back" class="secondary">Abrir Mercado Livre</button><button id="logout" class="secondary">Sair</button></section>
<script nonce="{{ nonce }}">
const el=id=>document.getElementById(id);let mode='login',csrf=null,busy=false;
async function call(path,data={}){if(['connect','complete'].includes(path))await call('activity');if(!csrf){const r=await fetch('/api/extension/csrf',{cache:'no-store',credentials:'include'});if(!r.ok)throw Error();csrf=(await r.json()).csrf;}const r=await fetch('/api/extension/'+path,{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});if(!r.ok){if(r.status===404)csrf=null;throw Error(r.status===404?'Não foi possível concluir. Confira os dados ou entre novamente.':r.status===429?'Aguarde alguns minutos e tente novamente.':'Não foi possível conectar agora. Tente novamente.');}return r.json();}
function setMode(next){mode=next;el('title').textContent=mode==='register'?'Criar conta':mode==='complete'?'Atualizar minha conta':'Entrar';el('name-row').hidden=mode!=='register';el('name').required=mode==='register';el('terms-row').hidden=mode==='login';el('terms').required=mode!=='login';el('email').disabled=mode==='complete';el('email').required=mode!=='complete';el('submit').textContent=mode==='complete'?'Salvar':mode==='register'?'Criar conta':'Entrar';el('toggle').textContent=mode==='register'?'Já tenho conta':'Criar conta';el('toggle').hidden=mode==='complete';el('password').autocomplete=mode==='register'?'new-password':'current-password';}
function notifyExtension(){window.dispatchEvent(new Event('novai-session-changed'));}
function show(s){if(!s.authenticated)return;notifyExtension();const needed=s.accountRequirements||{};if(needed.needsTerms||needed.needsPasswordUpdate){setMode('complete');el('new-password-row').hidden=!needed.needsPasswordUpdate;el('new-password').required=!!needed.needsPasswordUpdate;el('status').textContent='Confirme sua senha e aceite o acordo para continuar.';return;}el('form').hidden=true;el('connected').hidden=false;el('title').textContent='Conta conectada';el('status').textContent='';el('link-status').textContent=s.linked?'Mercado Livre conectado. Para usar outra conta, autorize novamente.':'Conecte sua conta do Mercado Livre para usar os recursos que precisam de autorização.';el('connect').textContent=s.linked?'Reconectar Mercado Livre':'Conectar Mercado Livre';el('password').value='';el('new-password').value='';}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){el('status').textContent=e.message||'Não foi possível conectar agora.';}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
el('toggle').onclick=()=>{setMode(mode==='login'?'register':'login');el('status').textContent='';};
el('form').onsubmit=e=>{e.preventDefault();action(async()=>{const data={email:el('email').value,password:el('password').value,name:el('name').value,acceptedTerms:el('terms').checked,termsVersion:{{ terms_version|tojson }}};if(mode==='complete'&&!el('new-password-row').hidden)data.newPassword=el('new-password').value;show(await call(mode,data));});};
el('connect').onclick=()=>action(async()=>{const r=await call('connect');const u=new URL(r.url);if(u.origin!=='https://auth.mercadolivre.com.br')throw Error();location.assign(u.href);});
el('back').onclick=()=>location.assign('https://www.mercadolivre.com.br/');
el('logout').onclick=()=>action(async()=>{await call('logout');notifyExtension();location.reload();});
call('session').then(show).catch(()=>{});
</script></main></body></html>
